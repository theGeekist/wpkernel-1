name: Documentation Promotion Admission

on:
    pull_request_target:
        branches: [main]
        types: [opened, synchronize, reopened, edited]

permissions:
    contents: read
    pull-requests: read

jobs:
    promotion-source:
        name: Check documentation promotion source
        if: github.repository == 'wpkernel/wpkernel'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout trusted base only
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  persist-credentials: false

            - name: Read complete unchanged pull metadata
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('node:fs');
                      const path = require('node:path');
                      const { promotionPullPaths } = require('./scripts/docs/promotion-resolver.cjs');
                      const expected = context.payload.pull_request;
                      const args = { ...context.repo, pull_number: context.issue.number };
                      const assertRevision = (pull) => {
                        if (pull.head.sha !== expected.head.sha || pull.base.sha !== expected.base.sha) {
                          throw new Error('Pull revision changed during admission; rerun against the current event.');
                        }
                      };
                      const before = (await github.rest.pulls.get(args)).data;
                      assertRevision(before);
                      if (before.changed_files > 3000) {
                        throw new Error('Pull exceeds GitHub complete-file-list limit; split the promotion.');
                      }
                      const files = await github.paginate(github.rest.pulls.listFiles, { ...args, per_page: 100 });
                      const after = (await github.rest.pulls.get(args)).data;
                      assertRevision(after);
                      const paths = promotionPullPaths(after, files);
                      fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'promotion-paths'), paths.join('\0'));

            - name: Validate using trusted base resolver
              shell: bash
              run: node scripts/docs/promotion-resolver.cjs check-pull-source --paths-file "${RUNNER_TEMP}/promotion-paths"
