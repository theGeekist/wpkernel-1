name: Deploy Documentation

on:
    push:
        branches:
            - main
        paths:
            - 'docs/**'
            - 'package.json'
            - '.github/workflows/docs.yml'
    workflow_dispatch:
    schedule:
        - cron: '*/15 * * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow one concurrent deployment
concurrency:
    group: pages
    cancel-in-progress: true

# Environment variables for caching
env:
    NODE_VERSION: '22.20.0'
    PNPM_VERSION: '10.19.0'

jobs:
    build:
        name: Qualify and build authoring documentation
        runs-on: ubuntu-latest
        outputs:
            ready: ${{ steps.qualify.outputs.ready }}
            source-sha: ${{ steps.qualify.outputs.source-sha }}
        steps:
            - name: Check out authoring source
              uses: actions/checkout@v4
              with:
                  repository: theGeekist/wpkernel-1
                  ref: main
                  fetch-depth: 1

            - name: Qualify authoring revision
              id: qualify
              shell: bash
              run: |
                  set -euo pipefail
                  source_sha="$(git rev-parse HEAD)"
                  author_name="$(git show -s --format=%an HEAD)"
                  author_email="$(git show -s --format=%ae HEAD)"
                  committer_name="$(git show -s --format=%cn HEAD)"
                  committer_email="$(git show -s --format=%ce HEAD)"

                  test "${author_name}" = 'Pipe Work'
                  test "${author_email}" = '780157+pipewrk@users.noreply.github.com'
                  test "${committer_name}" = 'Pipe Work'
                  test "${committer_email}" = '780157+pipewrk@users.noreply.github.com'

                  api_url="https://api.github.com/repos/theGeekist/wpkernel-1/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&head_sha=${source_sha}&per_page=10"
                  successful_runs="$(
                      curl --fail --silent --show-error --location \
                          --header 'Accept: application/vnd.github+json' \
                          --header 'X-GitHub-Api-Version: 2022-11-28' \
                          "${api_url}" |
                          jq --arg sha "${source_sha}" \
                              '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length'
                  )"

                  printf 'source-sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"
                  if [[ "${successful_runs}" == '0' ]]; then
                      echo "Authoring CI has not passed for ${source_sha}; deployment deferred."
                      printf 'ready=false\n' >> "${GITHUB_OUTPUT}"
                      exit 0
                  fi

                  printf 'ready=true\n' >> "${GITHUB_OUTPUT}"

            - name: Setup pnpm
              if: steps.qualify.outputs.ready == 'true'
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              if: steps.qualify.outputs.ready == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'

            - name: Cache node_modules
              if: steps.qualify.outputs.ready == 'true'
              id: cache-node-modules
              uses: actions/cache@v4
              with:
                  path: |
                      node_modules
                      packages/*/node_modules
                      examples/*/node_modules
                  key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: |
                      node-modules-${{ runner.os }}-

            - name: Install dependencies
              if: steps.qualify.outputs.ready == 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
              run: pnpm install --frozen-lockfile

            - name: Setup Pages
              if: steps.qualify.outputs.ready == 'true'
              uses: actions/configure-pages@v5

            - name: Build documentation
              if: steps.qualify.outputs.ready == 'true'
              run: pnpm docs:build

            - name: Upload artifact
              if: steps.qualify.outputs.ready == 'true'
              uses: actions/upload-pages-artifact@v3
              with:
                  path: docs/.vitepress/dist

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        needs: build
        if: needs.build.outputs.ready == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
